<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff8f0">
<title>猫猫银行 · 敲敲提款机</title>
<meta name="description" content="一台软乎乎的猫猫提款机。敲一下掉小鱼干，连击会猫猫暴击，暴击会下小鱼干雨。">
<style>
  :root{
    --ink:#5a4038;
    --muted:#a98276;
    --peach:#ff9e7a;
    --peach-deep:#ef7a4e;
    --pink:#ffb3c8;
    --sky:#6cc7d9;
    --gold:#f6b84b;
    --cream:#fffdf8;
    --line:#f3d9c9;
    --shadow:0 18px 40px rgba(210,150,120,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 12% -8%, #ffe4d2 0%, transparent 62%),
      radial-gradient(760px 480px at 108% 8%, #d9f2f7 0%, transparent 58%),
      radial-gradient(700px 600px at 50% 118%, #fff0cc 0%, transparent 60%),
      #fff8f0;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:20px 14px calc(20px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(239,122,78,.08) 1.5px, transparent 1.5px);
    background-size:26px 26px;
    mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }
  .deco{position:fixed;z-index:0;pointer-events:none;user-select:none;opacity:.6;filter:saturate(.9)}
  .deco.c1{left:6%;top:9%;font-size:34px;animation:floaty 7s ease-in-out infinite}
  .deco.c2{right:8%;top:16%;font-size:25px;animation:floaty 9s ease-in-out infinite reverse}
  .deco.c3{left:11%;bottom:12%;font-size:27px;animation:floaty 8s ease-in-out infinite 1s}
  .deco.c4{right:12%;bottom:8%;font-size:32px;animation:floaty 10s ease-in-out infinite .6s}
  .blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none;z-index:0}
  .blob.b1{width:240px;height:240px;left:-80px;top:18%;background:#ffd9c7}
  .blob.b2{width:220px;height:220px;right:-70px;top:42%;background:#c9eef5}
  .blob.b3{width:260px;height:260px;left:30%;bottom:-140px;background:#ffe7b8}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}

  .stage{position:relative;z-index:2;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}

  /* ---------- 机器 ---------- */
  .atm{
    position:relative;width:100%;border-radius:34px;padding:16px 15px 15px;
    background:linear-gradient(160deg,#fffdf9 0%,#fff0e2 46%,#ffe8d4 100%);
    border:2px solid #ffd2b6;
    box-shadow:
      0 26px 60px rgba(205,140,100,.24),
      0 2px 0 rgba(255,255,255,.9) inset,
      0 -10px 24px rgba(255,200,160,.35) inset;
    user-select:none;
    transition:transform .1s ease;
  }
  .atm::after{
    content:"";position:absolute;inset:8px;border-radius:27px;pointer-events:none;
    border:1.5px dashed rgba(255,160,120,.35);
  }
  .atm:active{transform:scale(.996)}
  .atm.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translate(-2px,1px) rotate(-.4deg)}
    20%,80%{transform:translate(4px,-2px) rotate(.5deg)}
    30%,50%,70%{transform:translate(-6px,2px) rotate(-.6deg)}
    40%,60%{transform:translate(6px,-1px) rotate(.6deg)}
  }
  .atm.hot{box-shadow:0 26px 60px rgba(239,122,78,.3),0 0 0 5px rgba(255,158,122,.16),0 0 50px rgba(255,158,122,.3)}
  .atm.super{box-shadow:0 26px 60px rgba(239,122,78,.34),0 0 0 6px rgba(108,199,217,.2),0 0 70px rgba(246,184,75,.4)}
  .atm.raining{box-shadow:0 26px 60px rgba(239,122,78,.3),0 0 0 5px rgba(108,199,217,.22),0 0 60px rgba(255,158,122,.4)}
  body.fever::before{animation:dots 3s linear infinite}
  @keyframes dots{to{background-position:26px 26px}}

  /* 猫猫小脸 */
  .mascot{
    position:absolute;right:20px;top:-30px;width:62px;height:56px;z-index:5;
    background:radial-gradient(circle at 35% 30%,#ffe0b8,#f4b06a 72%);
    border:2px solid #d9914a;border-radius:48% 52% 46% 54% / 52% 48% 54% 46%;
    box-shadow:0 8px 16px rgba(180,120,60,.28),0 2px 0 rgba(255,255,255,.35) inset;
    animation:bob 3.4s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  .mascot .ear{
    position:absolute;top:-14px;width:0;height:0;z-index:0;
    border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #f4b06a;
    filter:drop-shadow(0 -1px 0 #d9914a);
  }
  .mascot .ear.l{left:4px;transform:rotate(-14deg)}
  .mascot .ear.r{right:4px;transform:rotate(14deg)}
  .mascot .eye{position:absolute;top:23px;width:6px;height:7px;border-radius:50%;background:#4a2f22;animation:blink 4.6s infinite}
  .mascot .eye.l{left:16px}
  .mascot .eye.r{right:16px}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .mascot .blush{position:absolute;top:33px;width:9px;height:5px;border-radius:50%;background:#ff9eae;opacity:.8}
  .mascot .blush.l{left:8px}
  .mascot .blush.r{right:8px}
  .mascot .nose{position:absolute;left:50%;top:29px;margin-left:-3px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #e07a7a}
  .mascot .whisker{position:absolute;top:32px;width:15px;height:1.5px;background:#b97a45;border-radius:2px;opacity:.75}
  .mascot .whisker.l1{left:-8px;transform:rotate(8deg)}
  .mascot .whisker.l2{left:-8px;top:37px;transform:rotate(-8deg)}
  .mascot .whisker.r1{right:-8px;transform:rotate(-8deg)}
  .mascot .whisker.r2{right:-8px;top:37px;transform:rotate(8deg)}
  .mascot.happy{animation:jump .5s ease}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.1)}70%{transform:translateY(0) scale(.96)}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 11px;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mark{
    width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(160deg,#ffe3c8,#ffd0a8);
    border:1.5px solid #f7bd8d;box-shadow:0 4px 10px rgba(210,140,80,.2),0 1px 0 #fff inset;
  }
  .brand .name{font-size:15px;font-weight:900;letter-spacing:.04em}
  .brand .sub{display:block;font-size:8px;letter-spacing:.24em;color:#b98d78;margin-top:2px;font-weight:700}
  .online{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.12em;color:#3f9d86;background:#e6faf3;border:1px solid #c8f0e4;border-radius:999px;padding:5px 9px;font-weight:800}
  .online i{width:6px;height:6px;border-radius:50%;background:#55c9a8;box-shadow:0 0 7px #55c9a8;animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- 屏幕 ---------- */
  .screen{
    position:relative;border-radius:20px;padding:14px 15px 13px;
    background:linear-gradient(180deg,#fffdf8,#fff9f2);
    border:2px solid #ffd9be;
    box-shadow:0 0 0 4px rgba(255,255,255,.55),0 10px 22px rgba(210,150,110,.12) inset;
    overflow:hidden;z-index:2;
  }
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(circle at 85% 12%, rgba(255,210,180,.3), transparent 28%);
  }
  .screen-top{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.13em;color:#c3a294}
  .reset{appearance:none;border:0;background:transparent;color:#d3aa9c;font-size:9px;letter-spacing:.1em;font-family:inherit;cursor:pointer;padding:2px 4px}
  .reset:active{color:var(--peach-deep)}
  .label{font-size:10px;letter-spacing:.13em;color:#b98d76;margin-top:10px;font-weight:700}
  .balance{display:flex;align-items:baseline;gap:7px;margin-top:2px;font-variant-numeric:tabular-nums}
  .balance #balance{font-size:clamp(38px,11vw,50px);font-weight:900;line-height:1.05;color:#5a4038;letter-spacing:-.02em}
  .balance .fish{font-size:24px;line-height:1;transform:translateY(2px)}
  .balance .unit{font-size:9px;letter-spacing:.16em;color:#c39a86;font-weight:800;margin-left:2px}
  .balance #balance.long{font-size:34px}
  .balance #balance.xlong{font-size:27px}

  .meters{display:flex;gap:12px;margin-top:11px}
  .meter{flex:1}
  .mh{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.06em;color:#b98d76;margin-bottom:5px;font-weight:700}
  .mh b{color:#ef7a4e}
  .bar{height:7px;border-radius:99px;background:#ffe8d8;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffc9a8,#ff9e7a);transition:width .12s linear}
  #critBar{background:linear-gradient(90deg,#9fe3ef,#6cc7d9)}
  .ticker{margin-top:9px;height:16px;font-size:10px;letter-spacing:.03em;color:#b98d76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .ticker.crit{color:#e08a3a;text-shadow:0 1px 0 #fff3d8}

  /* ---------- 出小鱼干口 ---------- */
  .mid{display:grid;grid-template-columns:1fr 112px;gap:11px;align-items:stretch;margin-top:12px;position:relative;z-index:2}
  .slot{
    position:relative;min-height:48px;border-radius:14px;
    background:linear-gradient(180deg,#ffe9d8,#ffddc6);
    border:2px solid #ffc6a8;
    box-shadow:0 6px 12px rgba(210,130,90,.14) inset,0 1px 0 #fff inset;
    overflow:hidden;
  }
  .slot .mouth{
    position:absolute;left:11px;right:11px;top:50%;transform:translateY(-50%);height:19px;border-radius:8px;
    background:linear-gradient(180deg,#6b4a3f,#5a3a31);
    box-shadow:0 4px 8px rgba(70,35,25,.5) inset;
  }
  .slot .mouth::before,.slot .mouth::after{
    content:"";position:absolute;top:0;width:9px;height:6px;background:#fff7ea;border-radius:0 0 4px 4px;
  }
  .slot .mouth::before{left:9px}
  .slot .mouth::after{right:9px}
  .slot .tag{position:absolute;left:13px;bottom:4px;font-size:7px;letter-spacing:.18em;color:#c69a86;font-weight:800}
  .slot::after{content:"🐾";position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:13px;opacity:.32}
  .slot .led{position:absolute;right:12px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#7ed6c1;box-shadow:0 0 8px #7ed6c1;animation:pulse 2s infinite}
  .slot.boing{animation:boing .28s ease}
  .slot.puff{animation:puff .18s ease}
  .emit-glow{position:absolute;left:50%;top:50%;width:54px;height:30px;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;background:radial-gradient(ellipse,rgba(255,246,214,.95),rgba(255,190,140,.45) 45%,transparent 75%);filter:blur(1px)}
  .emit-glow.on{animation:emit .24s ease-out}
  @keyframes emit{0%{opacity:.95;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
  @keyframes puff{0%{filter:brightness(1)}35%{filter:brightness(1.18)}100%{filter:brightness(1)}}
  @keyframes boing{0%{transform:scale(1)}40%{transform:scale(1.05,.92)}70%{transform:scale(.98,1.03)}100%{transform:scale(1)}}

  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .key{
    height:23px;border-radius:7px;background:#fffdf9;border:1.5px solid #f6ddc9;
    box-shadow:0 2px 0 rgba(220,160,120,.18),0 1px 0 #fff inset;
    font-size:9px;color:#c39a86;display:grid;place-items:center;font-weight:800;
  }
  .key.gold{color:#d9942e;border-color:#f3d3a2;background:#fff8e8}
  .key.wide{grid-column:span 2;color:#ef7a4e;background:#fff0e6;border-color:#ffd2b6}

  /* ---------- 敲击按钮 ---------- */
  .hit-btn{
    width:100%;margin-top:13px;appearance:none;border:0;border-radius:18px;
    padding:15px 12px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#ffc9a0 0%,#ff9e7a 50%,#ef7a4e 100%);
    color:#fff;font-weight:900;font-size:19px;letter-spacing:.18em;
    box-shadow:0 6px 0 #c85f35,0 14px 24px rgba(239,122,78,.3),0 2px 0 rgba(255,255,255,.5) inset;
    transition:transform .07s ease,box-shadow .07s ease;
    position:relative;overflow:hidden;z-index:2;
  }
  .hit-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c85f35,0 8px 16px rgba(239,122,78,.28)}
  .hit-btn span{display:block;font-size:9px;letter-spacing:.22em;font-weight:800;opacity:.85;margin-top:3px}
  .hit-btn::after{
    content:"";position:absolute;top:-60%;left:-40%;width:36%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(18deg);animation:sheen 4s infinite;
  }
  @keyframes sheen{0%,68%{left:-45%}86%,100%{left:125%}}

  .hint{margin-top:13px;font-size:10px;letter-spacing:.05em;color:#b08d7c;text-align:center;font-weight:600}
  .hint b{color:#ef7a4e}

  /* ---------- 特效层 ---------- */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
  .flash{
    position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;
    background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.95),rgba(255,220,190,.45) 42%,transparent 72%);
  }
  .flash.on{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}

  .crit-text{
    position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.55);
    z-index:60;pointer-events:none;opacity:0;text-align:center;
    font-weight:900;font-size:clamp(32px,10vw,54px);letter-spacing:.02em;
    background:linear-gradient(90deg,#ff8a5c,#ffd166,#6cc7d9,#ff9ec7,#ff8a5c);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 8px 18px rgba(239,122,78,.45));
    white-space:nowrap;
    transition:opacity .16s ease,transform .34s cubic-bezier(.2,.9,.3,1.3);
    animation:rainbow 1.1s linear infinite;
  }
  @keyframes rainbow{to{background-position:220% 0}}
  .crit-text small{display:block;font-size:11px;letter-spacing:.3em;color:#e08a3a;margin-top:7px;font-weight:900;-webkit-text-fill-color:#e08a3a}
  .crit-text.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}

  .sound{
    position:fixed;right:14px;top:14px;z-index:80;width:38px;height:38px;border-radius:50%;
    border:1.5px solid #ffd2b6;background:rgba(255,253,248,.9);
    color:#ef7a4e;font-size:15px;cursor:pointer;box-shadow:0 6px 14px rgba(210,150,110,.2);
  }
  .sound.off{opacity:.45;text-decoration:line-through}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
    background:#5a4038;color:#fff7ee;font-size:12px;padding:10px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.22s ease;z-index:90;white-space:nowrap;font-weight:700;
    box-shadow:0 10px 24px rgba(90,60,50,.25);
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:360px){
    .atm{padding:13px 12px;border-radius:28px}
    .mid{grid-template-columns:1fr 96px}
    .balance #balance{font-size:38px}
    .hit-btn{font-size:17px;letter-spacing:.1em}
    .mascot{right:14px;width:54px;height:49px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="deco c1">🐟</div><div class="deco c2">🧶</div><div class="deco c3">🐾</div><div class="deco c4">🐱</div>

<div class="stage">
  <div class="atm" id="atm">
    <div class="mascot" id="mascot" aria-hidden="true">
      <span class="ear l"></span><span class="ear r"></span>
      <span class="eye l"></span><span class="eye r"></span>
      <span class="blush l"></span><span class="blush r"></span>
      <span class="nose"></span>
      <span class="whisker l1"></span><span class="whisker l2"></span>
      <span class="whisker r1"></span><span class="whisker r2"></span>
    </div>

    <div class="topbar">
      <div class="brand">
        <div class="mark">🐱</div>
        <div>
          <div class="name">猫猫银行</div>
          <span class="sub">CAT BANK · 24H</span>
        </div>
      </div>
      <div class="online"><i></i>喵营业中</div>
    </div>

    <div class="screen">
      <div class="screen-top">
        <span>NO. 0713 · 猫猫专用</span>
        <button class="reset" id="reset" type="button">RESET</button>
      </div>
      <div class="label">我的小鱼干</div>
      <div class="balance" aria-live="polite">
        <span id="balance">0</span>
        <span class="fish">🐟</span>
        <span class="unit">FISH</span>
      </div>
      <div class="meters">
        <div class="meter">
          <div class="mh"><span>连击 COMBO</span><b id="comboTxt">×0</b></div>
          <div class="bar"><i id="comboBar"></i></div>
        </div>
        <div class="meter">
          <div class="mh"><span>猫猫暴击率</span><b id="critTxt">8%</b></div>
          <div class="bar"><i id="critBar" style="width:8%"></i></div>
        </div>
      </div>
      <div class="ticker" id="ticker">敲一下，掉小鱼干</div>
    </div>

    <div class="mid">
      <div class="slot" id="slot">
        <div class="mouth" id="mouth"></div>
        <div class="emit-glow" id="emitGlow"></div>
        <span class="tag">FISH OUT</span>
        <span class="led"></span>
      </div>
      <div class="keypad" aria-hidden="true">
        <div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key gold">🐟</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">↵</div>
        <div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key">0</div>
        <div class="key wide">CLEAR</div><div class="key wide">TAP</div>
      </div>
    </div>

    <button class="hit-btn" id="hitBtn" type="button">
      敲 一 敲
      <span>TAP FOR FISH</span>
    </button>
  </div>
  <div class="hint">点机器任意位置，或按 <b>空格</b> · 连击越高越容易猫猫暴击</div>
</div>

<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div class="crit-text" id="critText">猫猫暴击!<small>×9 小鱼干加成</small></div>
<button class="sound" id="soundBtn" type="button" title="音效开关">♪</button>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var atm = $("#atm");
  var balanceEl = $("#balance");
  var comboTxt = $("#comboTxt");
  var comboBar = $("#comboBar");
  var critTxt = $("#critTxt");
  var critBar = $("#critBar");
  var ticker = $("#ticker");
  var slot = $("#slot");
  var mouthEl = $("#mouth");
  var emitGlow = $("#emitGlow");
  var mascot = $("#mascot");
  var canvas = $("#fx");
  var ctx = canvas.getContext("2d", { alpha: true });
  var flash = $("#flash");
  var critText = $("#critText");
  var soundBtn = $("#soundBtn");
  var toastEl = $("#toast");

  var KEY = "cat_bank_v1";
  var OLD_KEYS = ["abyss_atm_v1", "cookie_bank_v1"];

  var state = { balance: 0, combo: 0, lastHit: 0, hits: 0, sound: true };

  function loadSave(raw) {
    try {
      var d = JSON.parse(raw || "{}");
      if (typeof d.balance === "number" && isFinite(d.balance)) state.balance = Math.max(0, Math.floor(d.balance));
      if (typeof d.hits === "number") state.hits = d.hits;
      if (d.sound === false) state.sound = false;
    } catch (e) {}
  }
  try {
    var raw = localStorage.getItem(KEY);
    if (raw === null) {
      for (var oi = 0; oi < OLD_KEYS.length && raw === null; oi++) raw = localStorage.getItem(OLD_KEYS[oi]);
    }
    loadSave(raw);
  } catch (e) {}

  var saveTimer = 0;
  function saveNow() {
    try { localStorage.setItem(KEY, JSON.stringify({ balance: state.balance, hits: state.hits, sound: state.sound })); } catch (e) {}
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 450); }
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(); });

  // ---------- 数字滚动（单循环） ----------
  var shown = state.balance;
  var targetBalance = state.balance;
  var counterRunning = false;

  function fmt(n) { return Math.floor(n).toLocaleString("en-US"); }
  function paintBalance() {
    var t = fmt(shown);
    balanceEl.textContent = t;
    var n = t.length;
    balanceEl.classList.toggle("long", n >= 7 && n < 9);

  }
  function stepBalance() {
    var diff = targetBalance - shown;

      return;
    }
    shown += diff * 0.26;
    paintBalance();
    requestAnimationFrame(stepBalance);
  }

  // ---------- 音效 ----------
  var actx = null;
  var lastToneAt = 0;
  function audio() {

  function tone(freq, dur, type, vol, delay) {
    var a = audio();

    var t = a.currentTime + (delay || 0);

    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.02, t + 0.008);

    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxHit() {
    var now = performance.now();
    if (now - lastToneAt < 42) return;
    lastToneAt = now;
    tone(1180, 0.05, "triangle", 0.016);
    tone(1720, 0.035, "sine", 0.009, 0.015);
  }
  function sfxCrit() {
    lastToneAt = performance.now();
    tone(660, 0.09, "triangle", 0.028);
    tone(880, 0.09, "triangle", 0.028, 0.06);
    tone(1100, 0.12, "sine", 0.03, 0.12);
    tone(1480, 0.16, "sine", 0.022, 0.19);
  }

  soundBtn.classList.toggle("off", !state.sound);
  soundBtn.addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    state.sound = !state.sound;
    soundBtn.classList.toggle("off", !state.sound);
    saveSoon();
    if (state.sound) sfxHit();
  });

  // ---------- Canvas 粒子引擎 ----------
  var DPR = 1, W = 0, H = 0;
  var particles = [];
  var MAX = 130;
  var RAIN_MAX = 44;
  var running = false;
  var lastFrame = 0;
  var slotPoint = { x: 0, y: 0 };

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = W < 520 ? 0.8 : 1;
    MAX = W < 520 ? 130 : 190;
    RAIN_MAX = W < 520 ? 44 : 64;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cacheSlot();
  }
  function cacheSlot() {
    var r = mouthEl.getBoundingClientRect();
    slotPoint.x = r.left + r.width / 2;
    slotPoint.y = r.top + r.height / 2;
  }
  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(resize, 180); }, { passive: true });

  var FISH_COLORS = [
    ["#ffb27a", "#ef7a4e"],
    ["#9fe3ef", "#5cbccf"],
    ["#ffc9d6", "#ff8fb1"],
    ["#c9c2ff", "#8b7cf6"],
    ["#ffe08a", "#f6b84b"]
  ];
  var CONFETTI = ["#ff9e7a", "#f6b84b", "#6cc7d9", "#a78bfa", "#ffb3c8", "#7ed6c1"];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function addParticle(p) {
    if (particles.length >= MAX) {
      // 关键：新粒子进来时先淘汰“爆发型”旧粒子，永远不主动清掉还在下的小鱼干雨
      var drop = -1;
      for (var di = 0; di < particles.length; di++) {
        if (particles[di].type !== "rain") { drop = di; break; }
      }
      if (drop < 0) return;
      particles.splice(drop, 1);
    }
    particles.push(p);
    if (!running) {
      running = true;
      lastFrame = 0;
      requestAnimationFrame(frame);
    }
  }

  function spawnFish(x, y, crit, fromTop) {
    var pal = crit ? pick([["#ffd9a8", "#f6b84b"], ["#ffc9d6", "#ff8fb1"]]) : pick(FISH_COLORS);
    addParticle({
      type: "fish",
      x: fromTop ? rand(0, W) : x + rand(-4, 4),
      y: fromTop ? rand(-40, -10) : y + rand(-4, 4),
      vx: fromTop ? rand(-40, 40) : rand(-200, 200),
      vy: fromTop ? rand(80, 180) : rand(-540, -230),
      g: fromTop ? 120 : 980,
      rot: rand(-0.4, 0.4), vr: rand(-9, 9),
      r: crit ? rand(8, 12) : rand(6, 10),
      c1: pal[0], c2: pal[1],
      life: rand(0.9, 1.5), max: 1.5
    });
  }
  function countRain() {
    var n = 0;
    for (var i = 0; i < particles.length; i++) if (particles[i].type === "rain") n++;
    return n;
  }
  function spawnRainFish(x, y) {
    var n = countRain();
    if (n >= RAIN_MAX) {
      for (var i = 0; i < particles.length; i++) {
        if (particles[i].type === "rain") { particles.splice(i, 1); break; }
      }
    }
    var pal = pick([["#ffd9a8", "#f6b84b"], ["#ffc9d6", "#ff8fb1"], ["#9fe3ef", "#5cbccf"], ["#ffb27a", "#ef7a4e"]]);
    addParticle({
      type: "rain",
      x: x + rand(-10, 10), y: y + rand(-3, 3),
      vx: rand(-260, 260), vy: rand(-760, -480),
      g: 620, rot: rand(-0.6, 0.6), vr: rand(-3.2, 3.2),
      r: rand(7, 11), c1: pal[0], c2: pal[1],
      life: rand(2.6, 3.6), max: 3.6
    });
  }
  function spawnPaw(x, y) {
    addParticle({
      type: "paw",
      x: x + rand(-6, 6), y: y + rand(-4, 4),
      vx: rand(-170, 170), vy: rand(-500, -190),
      g: 900, rot: rand(-0.6, 0.6), vr: rand(-8, 8),
      r: rand(5, 8), color: pick(["#ffb27a", "#ffc9d6", "#9fe3ef", "#ffe08a"]),
      life: rand(0.8, 1.3), max: 1.3
    });
  }
  function spawnYarn(x, y) {
    addParticle({
      type: "yarn",
      x: x + rand(-6, 6), y: y + rand(-4, 4),
      vx: rand(-150, 150), vy: rand(-460, -160),
      g: 880, rot: rand(0, 6.28), vr: rand(-10, 10),
      r: rand(6, 9), color: pick(["#ffb3c8", "#9fe3ef", "#c9c2ff"]),
      life: rand(0.8, 1.3), max: 1.3
    });
  }
  function spawnStar(x, y) {
    addParticle({
      type: "star", x: x, y: y,
      vx: rand(-220, 220), vy: rand(-380, -120),
      g: 500, rot: rand(0, 6.28), vr: rand(-8, 8),
      r: rand(4, 8), color: pick(["#ffd76a", "#fff1b8", "#ffb3c8"]),
      life: rand(0.7, 1.2), max: 1.2
    });
  }
  function spawnConfetti(x, y, fromTop) {
    addParticle({
      type: "confetti",
      x: fromTop ? rand(0, W) : x, y: fromTop ? rand(-30, -5) : y,
      vx: rand(-120, 120), vy: fromTop ? rand(60, 160) : rand(-420, -120),
      g: fromTop ? 120 : 600, rot: rand(0, 6.28), vr: rand(-10, 10),
      w: rand(5, 10), h: rand(7, 13), color: pick(CONFETTI),
      life: rand(1.1, 1.8), max: 1.8
    });
  }
  function spawnRing(x, y, crit) {
    addParticle({
      type: "ring", x: x, y: y, vx: 0, vy: 0, g: 0, r: 8, vr: 0, rot: 0,
      grow: crit ? 260 : 180,
      color: crit ? "rgba(246,184,75,.9)" : "rgba(255,158,122,.8)",
      life: 0.55, max: 0.55
    });
  }
  function spawnText(x, y, text, crit) {
    var textCount = 0;
    for (var ti = particles.length - 1; ti >= 0; ti--) if (particles[ti].type === "text") textCount++;
    if (textCount >= 4) {
      for (var tj = 0; tj < particles.length; tj++) {
        if (particles[tj].type === "text") { particles.splice(tj, 1); break; }
      }
    }
    addParticle({
      type: "text", x: x, y: y - 6,
      vx: rand(-12, 12), vy: -54, g: 0, rot: 0, vr: 0,
      text: text, crit: !!crit, life: 1.05, max: 1.05
    });
  }

  function spawnBurst(x, y, crit) {
    if (crit) {
      for (var i = 0; i < 26; i++) { spawnFish(x, y, true, false); if (i % 3 === 0) spawnPaw(x, y); }
      for (var j = 0; j < 10; j++) spawnConfetti(x, y, false);
      for (var k = 0; k < 6; k++) spawnStar(x, y);
      for (var m = 0; m < 10; m++) spawnConfetti(x, y, true);
      var rainN = 10 + Math.min(10, state.combo);
      for (var n = 0; n < rainN; n++) spawnRainFish(x, y);
      spawnRing(x, y, true);
      atm.classList.add("raining");
      clearTimeout(spawnBurst._rainT);
      spawnBurst._rainT = setTimeout(function () { atm.classList.remove("raining"); }, 1600);
    } else {
      var count = 10 + Math.min(10, state.combo);
      for (var a = 0; a < count; a++) {
        if (Math.random() < 0.2) spawnPaw(x, y);
        else if (Math.random() < 0.1) spawnYarn(x, y);
        else spawnFish(x, y, false, false);
      }
      if (state.combo >= 10) spawnStar(x, y);
      spawnRing(x, y, false);
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // 预渲染精灵：把每条鱼/爪印画一次，之后每帧只做 drawImage，手机端省很多
  var sprites = {};
  function makeSprite(key, w, h, draw) {
    if (sprites[key]) return sprites[key];
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    draw(g, w, h);
    sprites[key] = c;
    return c;
  }
  function fishSprite(c1, c2) {
    return makeSprite("f" + c1 + c2, 80, 48, function (g) {
      g.translate(40, 24);
      g.beginPath(); g.ellipse(0, 0, 24, 13, 0, 0, 6.2832);
      g.fillStyle = c1; g.fill();
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 1.6; g.stroke();
      g.beginPath();
      g.moveTo(-21, 0); g.lineTo(-35, -12); g.lineTo(-35, 12); g.closePath();
      g.fillStyle = c2; g.fill();
      g.beginPath(); g.arc(12, -3, 2.8, 0, 6.2832);
      g.fillStyle = "#5a4038"; g.fill();
    });
  }
  function pawSprite(color) {
    return makeSprite("p" + color, 64, 64, function (g) {
      g.translate(32, 34);
      g.fillStyle = color;
      g.beginPath(); g.ellipse(0, 7, 15, 12, 0, 0, 6.2832); g.fill();
      var toes = [[-14, -7], [-5, -15], [5, -15], [14, -7]];
      for (var i = 0; i < toes.length; i++) {
        g.beginPath(); g.arc(toes[i][0], toes[i][1], 5.6, 0, 6.2832); g.fill();
      }
    });
  }
  function yarnSprite(color) {
    return makeSprite("y" + color, 56, 56, function (g) {
      g.translate(28, 28);
      g.beginPath(); g.arc(0, 0, 20, 0, 6.2832);
      g.fillStyle = color; g.fill();
      g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2;
      g.beginPath(); g.arc(0, 0, 11, 0.4, 3.4); g.stroke();
      g.beginPath(); g.arc(0, 0, 11, 3.6, 6.2); g.stroke();
    });
  }
  function starSprite(color) {
    return makeSprite("s" + color, 40, 40, function (g) {
      g.translate(20, 20);
      g.beginPath();
      for (var i = 0; i < 8; i++) {
        var ang = i * Math.PI / 4;
        var rr = i % 2 === 0 ? 17 : 6.5;
        var x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath(); g.fillStyle = color; g.fill();
    });
  }

  function drawParticle(p) {
    var alpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.type === "fish" || p.type === "rain") {
      var fw = p.r * 3.4;
      ctx.drawImage(fishSprite(p.c1, p.c2), -fw / 2, -fw * 0.3, fw, fw * 0.6);
    } else if (p.type === "paw") {
      var pw = p.r * 3.1;
      ctx.drawImage(pawSprite(p.color), -pw / 2, -pw / 2, pw, pw);
    } else if (p.type === "yarn") {
      var yw = p.r * 3.2;
      ctx.drawImage(yarnSprite(p.color), -yw / 2, -yw / 2, yw, yw);
    } else if (p.type === "star") {
      var sw = p.r * 3.2;
      ctx.drawImage(starSprite(p.color), -sw / 2, -sw / 2, sw, sw);
    } else if (p.type === "confetti") {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else if (p.type === "ring") {
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.2832);
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.2; ctx.stroke();
    } else if (p.type === "text") {
      ctx.font = "900 " + (p.crit ? 22 : 17) + "px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(255,255,255,.92)";
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.crit ? "#e08a3a" : "#ef7a4e";
      ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }

  function frame(now) {
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.034, (now - lastFrame) / 1000);
    lastFrame = now;
    ctx.clearRect(0, 0, W, H);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      if (p.type === "ring") {
        p.r += p.grow * dt;
      } else if (p.type === "text") {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else {
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.vx *= (1 - 0.55 * dt);
      }
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 90 || p.x < -120 || p.x > W + 120) {
        particles.splice(i, 1);
        continue;
      }
      drawParticle(p);
    }

    if (particles.length > 0) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  // ---------- 界面 ----------
  function critChance() { return Math.min(0.30, 0.08 + state.combo * 0.012); }
  function renderMeters() {
    comboTxt.textContent = "×" + state.combo;
    comboBar.style.width = (state.combo === 0 ? 0 : Math.min(100, 8 + state.combo * 9)) + "%";
    var c = Math.round(critChance() * 100);
    critTxt.textContent = c + "%";
    critBar.style.width = Math.min(100, c * 3) + "%";
  }
  function setTicker(text, crit) {
    ticker.textContent = text;
    ticker.classList.toggle("crit", !!crit);
    clearTimeout(setTicker._t);
    setTicker._t = setTimeout(function () {
      ticker.classList.remove("crit");
      if (state.combo > 1) ticker.textContent = "连击 ×" + state.combo + " · 猫猫暴击率 " + Math.round(critChance() * 100) + "%";
      else ticker.textContent = "敲一下，掉小鱼干";
    }, 1900);
  }
  var toastTimer = 0;
  function toast(text) {

    toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 1300);
  }

  var critTimer = 0;
  function showCrit(mult) {
    var words = ["猫猫暴击!", "小鱼干雨!", "喵喵喵!", "大丰收!"];
    critText.firstChild.nodeValue = words[(Math.random() * words.length) | 0];
    critText.querySelector("small").textContent = "×" + mult + " 小鱼干加成";
    critText.classList.remove("on");
    void critText.offsetWidth;
    critText.classList.add("on");
    clearTimeout(critTimer);
    critTimer = setTimeout(function () { critText.classList.remove("on"); }, 1100);
  }

  // ---------- 敲击 ----------
  var milestone = 0;
  var lastCritFx = 0;
  var lastBoing = 0;
  var lastSlotCache = 0;
  function hit() {
    var now = performance.now();
    if (now - state.lastHit < 1600) state.combo = Math.min(99, state.combo + 1);
    else state.combo = 1;
    state.lastHit = now;
    state.hits += 1;

    var crit = Math.random() < critChance();
    var base = 4 + ((Math.random() * 9) | 0) + Math.floor(state.combo * 0.5);
    var mult = crit ? 8 + ((Math.random() * 7) | 0) : 1;
    var gain = base * mult;

    state.balance += gain;
    queueBalance();
    saveSoon();

    if (now - lastSlotCache > 500) { lastSlotCache = now; cacheSlot(); }
    var x = slotPoint.x, y = slotPoint.y;
    spawnBurst(x, y, crit);
    spawnText(x, y, "+" + fmt(gain), crit);
    if (!crit && state.combo >= 8) {
      spawnRainFish(x, y);
      if (state.combo >= 20) spawnRainFish(x, y);
    }

    if (now - lastBoing > 90) {
      lastBoing = now;
      slot.classList.remove("puff");
      void slot.offsetWidth;
      slot.classList.add("puff");
      emitGlow.classList.remove("on");
      void emitGlow.offsetWidth;
      emitGlow.classList.add("on");
      slot.classList.remove("boing");
      void slot.offsetWidth;
      slot.classList.add("boing");
    }

    if (crit) {
      sfxCrit();
      if (now - lastCritFx > 220) {
        lastCritFx = now;
        atm.classList.add("shake");
        setTimeout(function () { atm.classList.remove("shake"); }, 460);
        mascot.classList.remove("happy");
        void mascot.offsetWidth;
        mascot.classList.add("happy");
        flash.classList.remove("on");
        void flash.offsetWidth;
        flash.classList.add("on");
        showCrit(mult);
      }
      setTicker("猫猫暴击！掉下 " + fmt(gain) + " 条小鱼干", true);
    } else {
      sfxHit();
      setTicker("叮！+" + fmt(gain) + " 条小鱼干", false);
    }

    if (state.combo >= 20) { atm.classList.add("hot", "super"); document.body.classList.add("fever"); }
    else if (state.combo >= 10) { atm.classList.add("hot"); }
    else { atm.classList.remove("hot", "super"); document.body.classList.remove("fever"); }

    if (state.combo > 0 && state.combo % 10 === 0 && state.combo !== milestone) {
      milestone = state.combo;
      toast("COMBO ×" + state.combo + " · 猫猫手感火热！");
      for (var i = 0; i < 10; i++) spawnStar(x, y);
    } else if (state.combo % 10 !== 0) {
      milestone = 0;
    }

    renderMeters();
  }

  atm.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button")) return;
    hit();
  }, { passive: true });
  $("#hitBtn").addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    hit();
  }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      hit();
    }
  });

  $("#reset").addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    if (!confirm("要把小鱼干清零吗？猫猫会伤心的。")) return;
    state.balance = 0;
    state.combo = 0;
    shown = 0;
    targetBalance = 0;
    paintBalance();
    saveNow();
    renderMeters();
    setTicker("账户清零啦，重新开始攒小鱼干", false);
  }, { passive: true });

  setInterval(function () {
    if (state.combo > 0 && performance.now() - state.lastHit > 1600) {
      state.combo = 0;
      milestone = 0;
      atm.classList.remove("hot", "super");
      document.body.classList.remove("fever");
      renderMeters();
    }
  }, 160);

  resize();
  setTimeout(resize, 350);
  shown = state.balance;
  targetBalance = state.balance;
  paintBalance();
  renderMeters();
})();
</script>
