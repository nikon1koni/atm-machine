<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>深渊银行 · 敲击提款机</title>
<meta name="description" content="一台可以敲的虚拟提款机。敲一下吐一点「深渊信用点」，还有暴击。">
<style>
  :root{
    --bg:#05070d;
    --panel:#0d131c;
    --panel2:#131c28;
    --line:rgba(120,220,210,.16);
    --neon:#37f5d0;
    --neon-dim:#1a8f83;
    --violet:#8b5cf6;
    --gold:#ffcf5c;
    --gold-deep:#e39a1f;
    --text:#e9fff9;
    --muted:#7d9a95;
    --danger:#ff5c7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 50% 0%, #10252a 0%, transparent 65%),
      radial-gradient(700px 500px at 100% 100%, #1a1030 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100dvh;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom));
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(55,245,208,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(55,245,208,.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }
  .stage{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}

  /* ---------- 机器 ---------- */
  .atm{
    width:100%;position:relative;border-radius:30px;padding:14px;
    background:linear-gradient(160deg,#1b2635 0%,#0f1620 42%,#0a0f16 100%);
    border:1px solid rgba(55,245,208,.22);
    box-shadow:
      0 30px 80px rgba(0,0,0,.65),
      0 0 0 1px rgba(0,0,0,.6) inset,
      0 1px 0 rgba(255,255,255,.08) inset,
      0 0 60px rgba(55,245,208,.08);
    cursor:pointer;
    user-select:none;
    transition:transform .12s ease;
  }
  .atm:active{transform:scale(.995)}
  .atm.shake{animation:atmShake .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes atmShake{
    10%,90%{transform:translate(-2px,1px) rotate(-.3deg)}
    20%,80%{transform:translate(4px,-2px) rotate(.4deg)}
    30%,50%,70%{transform:translate(-6px,2px) rotate(-.5deg)}
    40%,60%{transform:translate(6px,-1px) rotate(.5deg)}
  }
  .atm.crit{box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 90px rgba(255,207,92,.28),0 0 0 1px rgba(255,207,92,.45) inset}
  .atm::after{
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.05) 45%,transparent 60%);
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(145deg,var(--neon),var(--violet));
    display:grid;place-items:center;font-size:14px;color:#04110f;font-weight:900;
    box-shadow:0 0 18px rgba(55,245,208,.45);
  }
  .brand .name{font-size:13px;font-weight:800;letter-spacing:.08em}
  .brand .sub{display:block;font-size:9px;letter-spacing:.26em;color:var(--muted);margin-top:2px}
  .online{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.18em;color:var(--neon)}
  .online i{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- 屏幕 ---------- */
  .screen{
    position:relative;border-radius:16px;padding:16px 16px 14px;
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(55,245,208,.10) 0%, transparent 60%),
      #06110f;
    border:1px solid rgba(55,245,208,.28);
    box-shadow:0 0 24px rgba(55,245,208,.12) inset, 0 10px 24px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);
    mix-blend-mode:multiply;
  }
  .screen-top{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.18em;color:#5f8a83}
  .screen-top .acct{color:#3f6f68}
  .label{font-size:10px;letter-spacing:.22em;color:#5f8a83;margin-top:12px}
  .balance{
    display:flex;align-items:baseline;gap:6px;margin-top:2px;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .balance #balance{
    font-size:clamp(38px,11vw,52px);font-weight:900;line-height:1.05;
    color:#d9fff8;text-shadow:0 0 22px rgba(55,245,208,.35);
  }
  .balance small{font-size:18px;color:var(--neon);font-weight:700}
  .unit{font-size:9px;letter-spacing:.18em;color:#4f7d76;margin-left:2px}
  .meters{display:flex;gap:12px;margin-top:12px}
  .meter{flex:1}
  .meter .mh{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;color:#5f8a83;margin-bottom:5px}
  .meter .mh b{color:#a9d8cf;font-weight:700}
  .bar{height:5px;border-radius:99px;background:rgba(120,220,210,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--neon),var(--violet));transition:width .12s linear}
  .ticker{
    margin-top:10px;height:16px;font-size:10px;letter-spacing:.06em;color:#7fd8c9;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ticker.crit{color:var(--gold);font-weight:800;text-shadow:0 0 12px rgba(255,207,92,.6)}

  /* ---------- 出钞口 ---------- */
  .mid{display:grid;grid-template-columns:1fr 118px;gap:12px;align-items:end;margin-top:12px}
  .slot-wrap{position:relative;padding:8px 0 0}
  .slot{
    position:relative;height:44px;border-radius:10px;
    background:linear-gradient(180deg,#05090d,#0b141b 55%,#05080b);
    border:1px solid #24323d;
    box-shadow:0 8px 18px rgba(0,0,0,.6) inset,0 -1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  .slot .mouth{
    position:absolute;left:10px;right:10px;top:12px;height:16px;border-radius:5px;
    background:linear-gradient(180deg,#020406,#0a1016);
    box-shadow:0 4px 10px rgba(0,0,0,.9) inset,0 0 0 1px rgba(55,245,208,.12);
  }
  .slot .glow{
    position:absolute;left:10px;right:10px;top:12px;height:16px;border-radius:5px;
    background:linear-gradient(90deg,transparent,rgba(55,245,208,.55),transparent);
    filter:blur(6px);opacity:0;transition:opacity .15s;
  }
  .slot.active .glow{opacity:1}
  .slot .tag{position:absolute;left:12px;bottom:4px;font-size:7px;letter-spacing:.22em;color:#3c5a55}
  .slot .led{position:absolute;right:12px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 2s infinite}

  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .key{
    height:24px;border-radius:6px;
    background:linear-gradient(180deg,#1b2735,#0d151e);
    border:1px solid rgba(120,220,210,.10);
    box-shadow:0 2px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06) inset;
    font-size:9px;color:#6b8c86;display:grid;place-items:center;
    font-weight:700;letter-spacing:.04em;
  }
  .key.wide{grid-column:span 2;color:#9ed8cd}
  .key.gold{color:var(--gold);border-color:rgba(255,207,92,.22)}

  /* ---------- 敲击按钮 ---------- */
  .hit-btn{
    width:100%;margin-top:14px;appearance:none;border:0;border-radius:16px;
    padding:15px 12px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#ffdf8a 0%,#ffc247 46%,#e89a19 100%);
    color:#2b1a04;font-weight:900;font-size:18px;letter-spacing:.22em;
    box-shadow:0 6px 0 #8d5608,0 14px 26px rgba(0,0,0,.45),0 0 30px rgba(255,207,92,.18);
    transition:transform .07s ease,box-shadow .07s ease;
    position:relative;overflow:hidden;
  }
  .hit-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8d5608,0 8px 16px rgba(0,0,0,.4)}
  .hit-btn span{display:block;font-size:9px;letter-spacing:.28em;font-weight:700;opacity:.62;margin-top:3px}
  .hit-btn::after{
    content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(18deg);animation:sheen 3.6s infinite;
  }
  @keyframes sheen{0%,70%{left:-40%}85%,100%{left:120%}}

  .hint{margin-top:14px;font-size:10px;letter-spacing:.14em;color:#4f6f6a;text-align:center}
  .hint b{color:#7fd8c9}

  /* ---------- 特效层 ---------- */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .bill{
    position:fixed;width:28px;height:15px;border-radius:3px;
    display:grid;place-items:center;font-size:9px;font-weight:900;
    color:rgba(4,20,18,.8);
    background:linear-gradient(135deg,var(--b1,#37f5d0),var(--b2,#1a8f83));
    box-shadow:0 0 10px rgba(55,245,208,.45),0 2px 4px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.35);
    will-change:transform,opacity;
  }
  .bill::before{
    content:"";position:absolute;inset:2px;border:1px dashed rgba(0,0,0,.28);border-radius:2px;
  }
  .chip{
    position:fixed;width:14px;height:14px;background:linear-gradient(135deg,#ffdf8a,#e39a1f);
    clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
    box-shadow:0 0 12px rgba(255,207,92,.7);
    will-change:transform,opacity;
  }
  .float-amt{
    position:fixed;font-size:18px;font-weight:900;color:var(--neon);
    text-shadow:0 0 14px rgba(55,245,208,.8);pointer-events:none;
    white-space:nowrap;will-change:transform,opacity;
  }
  .float-amt.crit{color:var(--gold);font-size:24px;text-shadow:0 0 20px rgba(255,207,92,.9)}
  .flash{
    position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;
    background:radial-gradient(circle at 50% 55%,rgba(255,235,180,.85),rgba(255,180,40,.25) 38%,transparent 70%);
  }
  .flash.on{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
  .shock{
    position:fixed;border:2px solid rgba(255,207,92,.85);border-radius:50%;
    pointer-events:none;z-index:46;transform:translate(-50%,-50%);
  }
  .crit-text{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.55);
    z-index:60;pointer-events:none;opacity:0;text-align:center;
    font-weight:900;letter-spacing:.04em;color:#fff7dd;
    font-size:clamp(30px,10vw,52px);
    text-shadow:0 0 18px #ffcf5c,0 0 44px rgba(255,160,20,.9),0 4px 0 #a45b00;
    white-space:nowrap;
    transition:opacity .16s ease, transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .crit-text small{display:block;font-size:12px;letter-spacing:.42em;color:#ffe9b0;margin-top:6px;text-shadow:none}
  .crit-text.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .sound{
    position:fixed;right:14px;top:14px;z-index:70;width:36px;height:36px;border-radius:50%;
    border:1px solid rgba(55,245,208,.25);background:rgba(10,20,24,.75);
    color:#7fd8c9;font-size:14px;cursor:pointer;backdrop-filter:blur(8px);
  }
  .sound.off{color:#4b5f5c;text-decoration:line-through}
  .reset{
    appearance:none;border:0;background:transparent;color:#3f6f68;
    font-size:8px;letter-spacing:.16em;cursor:pointer;font-family:inherit;padding:2px 4px;
  }
  .reset:hover{color:#7fd8c9}

  @media (max-width:360px){
    .atm{padding:11px;border-radius:24px}
    .mid{grid-template-columns:1fr 100px}
    .balance #balance{font-size:38px}
    .hit-btn{font-size:16px;letter-spacing:.14em}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="atm" id="atm">
    <div class="topbar">
      <div class="brand">
        <div class="mark">◈</div>
        <div>
          <div class="name">深渊银行</div>
          <span class="sub">ABYSS BANK · 24H</span>
        </div>
      </div>
      <div class="online"><i></i>ONLINE</div>
    </div>

    <div class="screen">
      <div class="screen-top">
        <span class="acct">ACCT 00-713-◈</span>
        <button class="reset" id="reset" type="button">RESET</button>
      </div>
      <div class="label">当前余额 / A-CREDITS</div>
      <div class="balance">
        <span id="balance">0</span>
        <small>◈</small>
        <span class="unit">A-CRED</span>
      </div>
      <div class="meters">
        <div class="meter">
          <div class="mh"><span>COMBO</span><b id="comboTxt">×0</b></div>
          <div class="bar"><i id="comboBar"></i></div>
        </div>
        <div class="meter">
          <div class="mh"><span>CRIT RATE</span><b id="critTxt">8%</b></div>
          <div class="bar"><i id="critBar" style="width:8%"></i></div>
        </div>
      </div>
      <div class="ticker" id="ticker">敲一下机器，开始提款</div>
    </div>

    <div class="mid">
      <div class="slot-wrap">
        <div class="slot" id="slot">
          <div class="glow"></div>
          <div class="mouth"></div>
          <span class="tag">CASH OUT</span>
          <span class="led"></span>
        </div>
      </div>
      <div class="keypad" aria-hidden="true">
        <div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key gold">◈</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">↵</div>
        <div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key">0</div>
        <div class="key wide">CLEAR</div><div class="key wide gold">TAP</div>
      </div>
    </div>

    <button class="hit-btn" id="hitBtn" type="button">
      敲 一 下
      <span>TAP TO WITHDRAW</span>
    </button>
  </div>
  <div class="hint">点击机器任意位置，或者按 <b>空格</b> · 连续敲击可叠加 COMBO</div>
</div>

<div class="fx" id="fx"></div>
<div class="flash" id="flash"></div>
<div class="crit-text" id="critText">CRITICAL<small>JACKPOT</small></div>
<button class="sound" id="soundBtn" type="button" title="音效开关">♪</button>

<script>
(function () {
  "use strict";

  var KEY = "abyss_atm_v1";
  var $ = function (s) { return document.querySelector(s); };

  var atm = $("#atm");
  var balanceEl = $("#balance");
  var comboTxt = $("#comboTxt");
  var comboBar = $("#comboBar");
  var critTxt = $("#critTxt");
  var critBar = $("#critBar");
  var ticker = $("#ticker");
  var slot = $("#slot");
  var fx = $("#fx");
  var flash = $("#flash");
  var critText = $("#critText");
  var soundBtn = $("#soundBtn");

  var state = {
    balance: 0,
    combo: 0,
    lastHit: 0,
    hits: 0,
    sound: true
  };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (typeof saved.balance === "number" && isFinite(saved.balance)) state.balance = Math.max(0, Math.floor(saved.balance));
    if (typeof saved.hits === "number") state.hits = saved.hits;
    if (saved.sound === false) state.sound = false;
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ balance: state.balance, hits: state.hits, sound: state.sound }));
    } catch (e) {}
  }

  function fmt(n) {
    return Math.floor(n).toLocaleString("en-US");
  }

  var shown = state.balance;
  var rollTimer = 0;
  function rollTo(target) {
    clearTimeout(rollTimer);
    var start = shown;
    var t0 = performance.now();
    var dur = Math.min(650, 180 + Math.abs(target - start) * 1.2);
    function step() {
      var t = performance.now();
      var p = Math.max(0, Math.min(1, (t - t0) / dur));
      var ease = 1 - Math.pow(1 - p, 3);
      shown = start + (target - start) * ease;
      balanceEl.textContent = fmt(shown);
      if (p < 1) {
        rollTimer = setTimeout(step, 16);
      } else {
        shown = target;
        balanceEl.textContent = fmt(target);
      }
    }
    step();
  }

  function critChance() {
    return Math.min(0.30, 0.08 + state.combo * 0.012);
  }

  function updateMeters() {
    comboTxt.textContent = "×" + state.combo;
    var w = Math.min(100, (state.combo % 20) / 20 * 100);
    comboBar.style.width = (state.combo === 0 ? 0 : Math.max(6, w)) + "%";
    var c = Math.round(critChance() * 100);
    critTxt.textContent = c + "%";
    critBar.style.width = Math.min(100, c * 3) + "%";
  }

  // ---------- 音效 ----------
  var actx = null;
  function audio() {
    if (!state.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, delay) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.04, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxHit() {
    tone(880, 0.07, "square", 0.025);
    tone(1320, 0.05, "triangle", 0.018, 0.02);
    tone(220, 0.06, "sine", 0.02, 0.01);
  }
  function sfxCrit() {
    tone(523, 0.12, "triangle", 0.04);
    tone(659, 0.12, "triangle", 0.04, 0.07);
    tone(784, 0.14, "triangle", 0.045, 0.14);
    tone(1046, 0.22, "sine", 0.05, 0.22);
    tone(1568, 0.18, "sine", 0.03, 0.3);
  }

  soundBtn.classList.toggle("off", !state.sound);
  soundBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    state.sound = !state.sound;
    soundBtn.classList.toggle("off", !state.sound);
    save();
    if (state.sound) sfxHit();
  });

  // ---------- 粒子 ----------
  var BILL_COLORS = [
    ["#37f5d0", "#137a70"],
    ["#8b5cf6", "#4c2a9e"],
    ["#ffcf5c", "#a45b00"],
    ["#6ee7ff", "#1b6f8a"]
  ];

  function slotCenter() {
    var r = slot.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.45 };
  }

  function spawnBill(cx, cy, crit) {
    var el = document.createElement("div");
    el.className = "bill";
    var pal = crit ? ["#ffdf8a", "#e39a1f"] : BILL_COLORS[Math.floor(Math.random() * BILL_COLORS.length)];
    el.style.setProperty("--b1", pal[0]);
    el.style.setProperty("--b2", pal[1]);
    el.textContent = "◈";
    el.style.left = cx + "px";
    el.style.top = cy + "px";
    fx.appendChild(el);

    var ang = -Math.PI / 2 + (Math.random() - 0.5) * (crit ? 2.2 : 1.5);
    var dist = (crit ? 130 : 60) + Math.random() * (crit ? 190 : 90);
    var dx = Math.cos(ang) * dist * (0.8 + Math.random() * 0.6);
    var dy = Math.sin(ang) * dist - (crit ? 30 : 10);
    var rot = (Math.random() - 0.5) * 720;
    var dur = 750 + Math.random() * (crit ? 550 : 350);

    var anim = el.animate([
      { transform: "translate(-50%,-50%) translate(0,0) scale(.4) rotate(0deg)", opacity: 0 },
      { transform: "translate(-50%,-50%) translate(" + dx * 0.35 + "px," + dy * 0.35 + "px) scale(1.05) rotate(" + rot * 0.3 + "deg)", opacity: 1, offset: 0.18 },
      { transform: "translate(-50%,-50%) translate(" + dx + "px," + (dy + 90) + "px) scale(.9) rotate(" + rot + "deg)", opacity: 0 }
    ], { duration: dur, easing: "cubic-bezier(.15,.7,.4,1)", fill: "forwards" });
    anim.onfinish = function () { el.remove(); };
  }

  function spawnChip(cx, cy, crit) {
    var el = document.createElement("div");
    el.className = "chip";
    el.style.left = cx + "px";
    el.style.top = cy + "px";
    if (crit) el.style.background = "linear-gradient(135deg,#fff3c4,#ffcf5c)";
    fx.appendChild(el);
    var ang = Math.random() * Math.PI * 2;
    var dist = 40 + Math.random() * (crit ? 200 : 110);
    var anim = el.animate([
      { transform: "translate(-50%,-50%) scale(.3) rotate(0deg)", opacity: 0 },
      { transform: "translate(-50%,-50%) translate(" + Math.cos(ang) * dist * .5 + "px," + Math.sin(ang) * dist * .5 + "px) scale(1) rotate(240deg)", opacity: 1, offset: .25 },
      { transform: "translate(-50%,-50%) translate(" + Math.cos(ang) * dist + "px," + (Math.sin(ang) * dist + 110) + "px) scale(.7) rotate(720deg)", opacity: 0 }
    ], { duration: 700 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)", fill: "forwards" });
    anim.onfinish = function () { el.remove(); };
  }

  function spawnAmount(cx, cy, text, crit) {
    var el = document.createElement("div");
    el.className = "float-amt" + (crit ? " crit" : "");
    el.textContent = text;
    el.style.left = cx + "px";
    el.style.top = cy + "px";
    fx.appendChild(el);
    var anim = el.animate([
      { transform: "translate(-50%,-50%) translateY(0) scale(.7)", opacity: 0 },
      { transform: "translate(-50%,-50%) translateY(-26px) scale(1.08)", opacity: 1, offset: .2 },
      { transform: "translate(-50%,-50%) translateY(-94px) scale(1)", opacity: 0 }
    ], { duration: crit ? 1200 : 850, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" });
    anim.onfinish = function () { el.remove(); };
  }

  function shock(cx, cy) {
    var el = document.createElement("div");
    el.className = "shock";
    el.style.left = cx + "px";
    el.style.top = cy + "px";
    el.style.width = "20px";
    el.style.height = "20px";
    fx.appendChild(el);
    var anim = el.animate([
      { transform: "translate(-50%,-50%) scale(.2)", opacity: .95, borderWidth: "4px" },
      { transform: "translate(-50%,-50%) scale(14)", opacity: 0, borderWidth: "1px" }
    ], { duration: 720, easing: "cubic-bezier(.1,.6,.3,1)", fill: "forwards" });
    anim.onfinish = function () { el.remove(); };
  }

  function showCrit(mult) {
    var words = ["CRITICAL", "JACKPOT", "MEGA CRIT", "OVERFLOW"];
    var word = words[Math.floor(Math.random() * words.length)];
    critText.firstChild.nodeValue = word;
    critText.querySelector("small").textContent = "×" + mult + " PAYOUT";
    critText.classList.remove("on");
    void critText.offsetWidth;
    critText.classList.add("on");
    clearTimeout(critTimer);
    critTimer = setTimeout(function () { critText.classList.remove("on"); }, 1100);
  }

  // ---------- 敲击 ----------
  var comboResetTimer = 0;
  var tickerTimer = 0;
  var critTimer = 0;

  function hit() {
    var now = Date.now();
    if (now - state.lastHit < 1600) state.combo = Math.min(99, state.combo + 1);
    else state.combo = 1;
    state.lastHit = now;
    state.hits += 1;

    var crit = Math.random() < critChance();
    var base = 3 + Math.floor(Math.random() * 9) + Math.floor(state.combo * 0.7);
    var mult = crit ? 8 + Math.floor(Math.random() * 7) : 1;
    var gain = base * mult;

    state.balance += gain;
    save();

    var c = slotCenter();
    var count = crit ? 34 + Math.floor(Math.random() * 18) : 5 + Math.min(8, state.combo);
    for (var i = 0; i < count; i++) {
      setTimeout(function () {
        spawnBill(c.x, c.y, crit);
        if (Math.random() < 0.45) spawnChip(c.x, c.y, crit);
      }, i * (crit ? 14 : 22));
    }

    spawnAmount(c.x, c.y - 10, "+" + fmt(gain) + " ◈", crit);

    slot.classList.add("active");
    setTimeout(function () { slot.classList.remove("active"); }, 260);

    if (crit) {
      atm.classList.add("crit");
      atm.classList.add("shake");
      setTimeout(function () { atm.classList.remove("shake"); }, 480);
      setTimeout(function () { atm.classList.remove("crit"); }, 900);
      flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
      shock(c.x, c.y);
      showCrit(mult);
      sfxCrit();
      ticker.classList.add("crit");
      ticker.textContent = "暴击！本次吐出 " + fmt(gain) + " ◈";
      rollTo(state.balance);
    } else {
      sfxHit();
      ticker.classList.remove("crit");
      ticker.textContent = "+" + fmt(gain) + " ◈ 已到账 · 继续敲";
      rollTo(state.balance);
    }

    updateMeters();

    clearTimeout(tickerTimer);
    tickerTimer = setTimeout(function () {
      ticker.classList.remove("crit");
      if (state.combo > 1) ticker.textContent = "COMBO ×" + state.combo + " · 暴击率 " + Math.round(critChance() * 100) + "%";
      else ticker.textContent = "敲一下机器，开始提款";
    }, 2200);

    clearTimeout(comboResetTimer);
    comboResetTimer = setTimeout(function () {
      state.combo = 0;
      updateMeters();
    }, 1600);
  }

  atm.addEventListener("click", function (e) {
    if (e.target.closest("button")) return;
    hit();
  });
  $("#hitBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    hit();
  });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      if (e.target && (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT")) return;
      e.preventDefault();
      hit();
    }
  });

  $("#reset").addEventListener("click", function (e) {
    e.stopPropagation();
    if (!confirm("清零当前余额？虚拟信用点不会真的退款。")) return;
    state.balance = 0;
    state.combo = 0;
    state.hits = 0;
    shown = 0;
    balanceEl.textContent = "0";
    save();
    updateMeters();
    ticker.textContent = "账户已清零，重新开始";
  });

  // 初始
  shown = state.balance;
  balanceEl.textContent = fmt(state.balance);
  updateMeters();
})();
</script>
</body>
</html>
